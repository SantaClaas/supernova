[package]
name = "shlepper"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
base64 = "0.22.1"
bitwarden = "2.1.0"
bitwarden-core = "3.0.0"
bollard = "0.21.0"
cookie = "0.18.1"
#TODO make this only available in development. Not needed in production.-
dotenvy = "0.15.7"
libsql = "0.9.30"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
time = { version = "0.3.53", features = ["serde"] }
tokio = { version = "1.53.0", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.24.0"
